<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 약속 마을 · 1단원 진짜가짜 광장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FF;--card:#fff;--ink:#0B1B3A;--sub:#4A5875;--blue:#2F55E8;--onb:#fff;--coral:#E8492C;--green:#0B8F63;--soft:#E3EAFF;--hi:#FFE9A3;--navy:#0B1B3A;--ok:#E6F8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1330;--card:#16224A;--ink:#EAF0FF;--sub:#A9B8E0;--blue:#7C9BFF;--onb:#0B1330;--coral:#FF8466;--green:#3DD6A0;--soft:#223066;--hi:#5A4A10;--navy:#070D22;--ok:#10352C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1330;--card:#16224A;--ink:#EAF0FF;--sub:#A9B8E0;--blue:#7C9BFF;--onb:#0B1330;--coral:#FF8466;--green:#3DD6A0;--soft:#223066;--hi:#5A4A10;--navy:#070D22;--ok:#10352C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;font-size:clamp(18px,2vw,26px);line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1280px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px clamp(14px,3vw,40px)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-weight:900;font-size:1.05em;background:none;border:0;padding:0}
.ph{flex:1;display:flex;gap:8px;min-width:260px}.ph span{flex:1;text-align:center;padding:6px 4px;border-radius:22px;background:var(--card);color:var(--sub);font-size:.8em}.ph .on{background:var(--coral);color:#fff;font-weight:900}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph .on{color:#0B1330}}
.tb{border:2px solid var(--blue);background:transparent;border-radius:22px;padding:6px 16px;font-weight:700;color:var(--blue)}
#tp{background:var(--card);border-radius:20px;padding:14px 20px;font-size:.78em;border-left:8px solid var(--blue)}#tp ul{margin:6px 0 0;padding-left:1.2em}
main{flex:1;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(28px,4vw,50px);line-height:1.25;font-weight:900}h2{margin:0;font-size:1.3em}
.tag{display:inline-block;background:var(--coral);color:#fff;border-radius:14px;padding:2px 14px;font-weight:900;font-size:.8em;margin-right:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#0B1330}}
.card{background:var(--card);border-radius:28px;box-shadow:0 10px 26px rgba(11,27,58,.1);padding:clamp(16px,2.2vw,28px)}
.row{display:flex;gap:18px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
.btn{min-height:64px;border-radius:32px;border:0;background:var(--blue);color:var(--onb);font-weight:900;padding:0 40px}.btn.g{background:var(--card);color:var(--ink);font-weight:700}.btn[disabled]{opacity:.4;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;text-decoration:none}.nav{display:flex;gap:14px;justify-content:flex-end;align-items:center;position:sticky;bottom:0;padding:10px 0}.nav .mid{margin-right:auto;font-size:.8em;color:var(--sub)}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:72px;background:var(--card);border:4px solid var(--card);border-radius:24px;padding:12px 18px;font-weight:700;box-shadow:0 8px 20px rgba(11,27,58,.08)}
.opt b{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--onb);display:flex;align-items:center;justify-content:center}.opt.ok{border-color:var(--green);background:var(--ok)}.opt.no{border-color:var(--coral)}
.say{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:12px 20px}.say svg{flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;flex:1}
.tile{border:0;text-align:left;color:#fff;border-radius:32px;padding:24px;min-height:230px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 26px rgba(11,27,58,.2)}.tile h2{font-size:1.5em;margin-top:auto}.tile small{font-size:.8em}
.tile[aria-disabled="true"]{opacity:.55;cursor:default}.n{width:52px;height:52px;border-radius:50%;background:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.pic{position:relative;overflow:hidden;border-radius:20px;min-height:200px;flex:1}
.lab{position:absolute;left:0;right:0;bottom:0;background:#0B1B3A;color:#fff;text-align:center;padding:8px;font-weight:700}
.mk{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.0) 0 14px,rgba(47,85,232,.55) 14px 18px);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 2px 6px #0B1B3A}
table{width:100%;border-collapse:collapse;font-size:.85em}td,th{padding:8px 12px;border-bottom:2px solid var(--soft);text-align:left}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.hl{background:var(--hi);border-radius:6px;padding:0 6px}.stamp{width:150px;height:150px;border-radius:50%;border:8px double var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;transform:rotate(-10deg)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const MAS='<svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#FFD43B"/><circle cx="36" cy="44" r="6" fill="#0B1B3A"/><circle cx="64" cy="44" r="6" fill="#0B1B3A"/><path d="M34 62q16 16 32 0" stroke="#0B1B3A" stroke-width="6" fill="none" stroke-linecap="round"/></svg>';
const PH=['도착','배우기','체험','퀴즈','약속'];
const st={res:false,home:true,i:0,tab:0,eye:false,pick:null,off:0,q:0,sc:0,ans:null,chk:[],stamp:false};
const Q=[
{q:'AI 챗봇 앱을 처음 열었어요. 어떤 안내가 필요할까요?',o:['“AI가 대답해요”라고 미리 알려 줘요','사람인 척하고 알려 주지 않아요','아무 안내도 하지 않아요'],a:0,e:'AI로 움직이는 서비스는 사용하기 전에 AI를 쓴다고 미리 알려야 해요.'},
{q:'AI로 그린 그림 파일 속에 숨은 표시가 들어 있어요. 괜찮을까요?',o:['괜찮아요. 일반 AI 그림은 숨은 표시도 돼요','안 돼요. 꼭 눈에 보여야 해요','표시가 없어도 돼요'],a:0,e:'워터마크나 메타데이터처럼 기계가 읽는 숨은 표시도 괜찮아요.'},
{q:'유명인이 하지 않은 말을 하는 진짜 같은 영상이에요. 어떤 표시가 꼭 필요할까요?',o:['파일 속 숨은 표시만 넣어요','화면에 보이는 “AI로 만든 가상 영상” 글자','표시 없이 올려요'],a:1,e:'진짜 같은 가짜는 사람이 눈이나 귀로 바로 알아챌 수 있게 표시해야 해요.'}];
const P=['표시를 먼저 살펴봐요','친구 얼굴·목소리로 가짜를 만들지 않아요','AI 표시를 지우지 않아요','AI 도움을 받았다면 솔직하게 말해요','이상한 영상은 어른께 알려요','한 번 더 생각해요'];
const V=[['생성형 AI','글, 그림, 음악, 영상처럼 새로운 것을 만들어 내는 AI예요.'],['딥페이크','AI로 실제 사람의 얼굴이나 목소리를 진짜처럼 흉내 낸 가짜예요.'],['워터마크','그림이나 영상 속에 넣는 표시예요. 눈에 보이는 것도, 숨긴 것도 있어요.'],['메타데이터','파일 안에 함께 저장된 정보예요. 언제, 무엇으로 만들었는지 적혀 있어요.'],['투명성','숨기지 않고 훤히 보이게 하는 것이에요.']];
const TN=[
'학습 목표 3개를 함께 소리 내어 읽어요. (도착 약 3분)',
'정답을 가르는 질문이 아니라 호기심을 여는 질문이에요. “눈으로만 보면 헷갈린다”를 끌어내 주세요. (약 2분)',
'세 가지 약속(제31조 ①②③항)을 학생 말로 풀었어요. 표시 의무는 AI 서비스를 만드는 회사에 있고, 학생 활동은 표시를 알아보고 존중하는 사용자 관점으로 지도해 주세요. (배우기 약 6분)',
'‘기계의 눈’을 학생이 번갈아 눌러 보게 해 주세요. 일반 생성물은 워터마크·메타데이터 같은 숨은 표시도 가능하지만, 실제와 구분하기 어려운 딥페이크는 사람이 명확히 알아볼 수 있는 표시가 필요해요. (약 6분)',
'‘표시 끄기’ 버튼을 학생이 직접 눌러 보며, 왜 끌 수 없게 해 두었는지 이야기 나눠요. 딥페이크는 많은 사람이 속고 당사자가 큰 상처를 받을 수 있어요. (약 12분)',
'문제마다 모둠이 먼저 의논한 뒤 답하게 해 보세요. (약 7분)',
'지킬 수 있는 약속을 눌러 체크해요. 3개 이상 고르면 다음으로 갈 수 있어요. (약 3분)',
'낱말을 복습하고 도장을 받아요. (약 1분)'];
const pic=(l)=>`<div class="pic" style="background:#BFE3FF"><div style="position:absolute;right:12%;top:14%;width:56px;height:56px;border-radius:50%;background:#FFD43B"></div><div style="position:absolute;left:-10%;width:70%;bottom:-40%;height:70%;border-radius:50%;background:#2CC98E"></div><div style="position:absolute;right:-12%;width:70%;bottom:-48%;height:70%;border-radius:50%;background:#0B8F63"></div>${l}</div>`;
const face=(l)=>`<div class="pic" style="background:#FFE1D6"><div style="position:absolute;left:50%;margin-left:-40px;top:12%;width:80px;height:80px;border-radius:50%;background:#F0A483"></div><div style="position:absolute;left:50%;margin-left:-100px;top:46%;width:200px;height:200px;border-radius:100px 100px 0 0;background:#F0A483"></div>${l}</div>`;
const intro=()=>face('<img src="images/intro-person.jpg" alt="AI로 만든 사람 그림" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">');
const S=[
()=>`<span class="tag">1단원</span><h1>AI가 만든 건 AI가 만들었다고 알려 줘요</h1><div class="card"><h2>오늘 배울 것</h2><ol><li>AI 결과물에 표시가 왜 필요한지 말할 수 있어요.</li><li>숨은 표시와 보이는 표시를 구별할 수 있어요.</li><li>똑똑한 AI 사용자의 약속을 정해요.</li></ol></div><div class="say">${MAS}<div>안녕! 진짜가짜 광장에 온 걸 환영해. 같이 탐험해 보자!</div></div>`,
()=>`<h1>이 그림 속 사람은 진짜일까요?</h1><div class="row"><div class="card" style="display:flex;flex-direction:column">${intro()}</div><div style="display:flex;flex-direction:column;gap:14px;justify-content:center"><button class="opt" data-a="pick" data-v="0"><b>가</b>진짜 사람이에요</button><button class="opt" data-a="pick" data-v="1"><b>나</b>AI가 만든 가짜예요</button>${st.pick!==null?`<div class="say">${MAS}<div>사실은 AI가 만든 그림이야. 눈으로만 보면 헷갈리지? 그래서 <span class="hl">“AI가 만들었어요”</span> 표시가 필요해.</div></div>`:''}</div></div>`,
()=>{const C=[['미리 알려요','AI로 움직이는 서비스는 사용하기 전에 “이 서비스는 AI를 써요”라고 알려요.','AI 챗봇 앱을 처음 열면 “AI가 대답해요”라는 안내가 나와요.'],['결과물에 표시해요','AI가 만든 글, 그림, 소리, 영상이 서비스 밖으로 퍼질 때는 AI가 만들었다는 표시를 해요. 눈에 안 보이는 숨은 표시도 괜찮아요.','AI로 그린 그림 파일 속에 “AI 생성” 정보가 들어 있어요.'],['진짜 같은 가짜는 더 분명하게','진짜 사람이나 진짜 일과 헷갈릴 만큼 비슷하면, 눈이나 귀로 바로 알아챌 수 있게 표시해요.','유명인이 하지 않은 말을 하는 영상에는 “AI로 만든 가상 영상” 글자가 보여야 해요.']][st.tab];return `<span class="tag">배우기 1</span><h1>세 가지 약속</h1><div class="row" style="flex:none">${['미리 알려요','결과물에 표시해요','진짜 같은 가짜는 더 분명하게'].map((t,k)=>`<button class="opt ${k==st.tab?'ok':''}" data-a="tab" data-v="${k}"><b>${k+1}</b>${t}</button>`).join('')}</div><div class="card"><h2>${C[0]}</h2><p>${C[1]}</p><p><span class="hl">예시</span> ${C[2]}</p></div><div class="say">${MAS}<div>표시를 붙이는 건 AI 서비스를 만드는 회사의 몫이야. 우리는 표시를 알아보는 똑똑한 사용자가 되면 돼!</div></div>`},
()=>`<span class="tag">배우기 2</span><h1>숨은 표시와 보이는 표시</h1><div class="row"><div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>일반 AI 그림</h2>${pic(st.eye?'<div class="mk">AI 생성 · 숨은 워터마크</div>':'')}<button class="btn" data-a="eye">${st.eye?'사람의 눈으로 보기':'기계의 눈으로 보기'}</button><div>${st.eye?'컴퓨터는 숨은 표시를 읽고 “AI 작품”이라고 알아내요.':'사람 눈에는 평범한 그림이에요. 숨은 표시도 괜찮아요.'}</div></div><div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>딥페이크 (진짜 같은 가짜)</h2>${face('<div class="lab">AI로 만든 가상 영상입니다</div>')}<div><b>숨기기 금지!</b> 화면에 글자가 꼭 보여야 해요. 목소리라면 귀로 들리는 안내를 해요.</div></div></div><div class="card"><table><tr><th>표시 방법</th><th>일반 AI 결과물</th><th>딥페이크</th></tr><tr><td>눈에 보이는 표시</td><td>돼요</td><td><b>꼭 해야 해요</b></td></tr><tr><td>숨은 표시만</td><td>돼요</td><td><b>안 돼요</b></td></tr></table></div>`,
()=>`<span class="tag">체험</span><h1>가상 영상의 표시를 꺼 볼까요?</h1><div class="row"><div class="card ${st.off?'shake':''}" style="display:flex;flex-direction:column;gap:12px" id="vid">${face('<div class="lab">AI로 만든 가상 영상입니다</div>')}<button class="btn" data-a="off">표시 끄기</button></div><div style="display:flex;flex-direction:column;gap:14px;justify-content:center">${st.off?`<div class="card" role="status"><h2>끌 수 없어요!</h2><p>진짜 사람처럼 보이는 영상은 많은 사람이 속을 수 있고, 그 사람이 큰 상처를 받을 수 있어요. 그래서 이 표시는 끄는 버튼이 없어요.</p><p>시도한 횟수: ${st.off}번</p></div>`:'<div class="card">버튼을 눌러 보세요. 어떤 일이 생길까요?</div>'}<div class="say">${MAS}<div>친구 얼굴이나 목소리로 가짜를 만드는 건, 장난이어도 큰 상처가 돼.</div></div></div></div>`,
()=>{if(st.q>=Q.length)return `<h1>퀴즈 끝! ${st.sc} / ${Q.length} 맞혔어요</h1><div class="say">${MAS}<div>${st.sc==Q.length?'모두 맞혔어! 진짜 탐정이야.':'잘했어! 틀린 문제는 다시 한 번 떠올려 봐.'}</div></div>`;const q=Q[st.q];return `<span class="tag">약속 퀴즈 ${st.q+1} / ${Q.length}</span><h1>${q.q}</h1>${q.o.map((t,k)=>`<button class="opt ${st.ans!==null?(k==q.a?'ok':(k==st.ans?'no':'')):''}" data-a="ans" data-v="${k}" ${st.ans!==null?'aria-disabled="true"':''}><b>${'가나다'[k]}</b>${t}${st.ans!==null&&k==q.a?' ✓ 정답':''}</button>`).join('')}${st.ans!==null?`<div class="say" role="status">${MAS}<div><b>${st.ans==q.a?'맞아요!':'아쉬워요.'}</b> ${q.e}</div></div><div><button class="btn" data-a="nq">${st.q+1<Q.length?'다음 문제':'결과 보기'}</button></div>`:''}`},
()=>`<span class="tag">약속 정하기</span><h1>똑똑한 AI 사용자의 약속</h1><p>지킬 수 있는 약속을 눌러 체크해요. (3개 이상)</p>${P.map((t,k)=>`<button class="opt ${st.chk.includes(k)?'ok':''}" data-a="chk" data-v="${k}" aria-pressed="${st.chk.includes(k)}"><b>${st.chk.includes(k)?'✓':k+1}</b>${t}</button>`).join('')}<div class="say">${MAS}<div>${st.chk.length} / ${P.length} 약속</div></div>`,
()=>`<span class="tag">낱말 사전</span><h1>오늘 배운 낱말</h1><div class="row">${V.map(v=>`<div class="card"><h2>${v[0]}</h2>${v[1]}</div>`).join('')}</div>${st.stamp?`<div class="card" style="display:flex;gap:24px;align-items:center"><div class="stamp">약속<br>지킴이</div><div><h2>진짜가짜 광장 완료!</h2>AI가 만든 건 AI가 만들었다고 알려요.</div></div>`:`<div><button class="btn" data-a="stamp">약속 도장 받기</button></div>`}`];
const R=[['수업 지도안','1단원 · 40분 수업 흐름과 단계별 발문 예시, 교사 유의사항','unit1-lesson-plan.html'],['학생 활동지','1단원 · 선 잇기, 빈칸 채우기, 나의 약속 (인쇄용)','unit1-worksheet.html'],['평가 질문·체크리스트','1단원 · 평가 질문과 기대 답, 학급 관찰 체크표','unit1-assessment.html']];
function resRoom(){return `<span class="tag">자료실</span><h1>선생님 자료실</h1><p>1단원 수업에 쓰는 인쇄용 자료예요. 열어서 인쇄하면 돼요. 인쇄 창에서 “PDF로 저장”을 고르면 PDF 파일이 돼요.</p><div class="row">${R.map(r=>`<div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>${r[0]}</h2><div>${r[1]}</div><div style="margin-top:auto;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="resources/${r[2]}" target="_blank" rel="noopener">열어서 인쇄하기</a></div></div>`).join('')}</div><div class="card">2~4단원 자료는 단원이 열릴 때 함께 올라와요.</div><div><button class="btn g" data-a="home">마을로</button></div>`}
const phOf=[0,0,1,1,2,3,4,4];
const tile=(c1,c2,n,t,s,p,on)=>`<button class="tile" style="background:linear-gradient(145deg,${c1},${c2})" ${on?`data-a="go"`:'aria-disabled="true"'}><div class="n" style="color:${c2}">${n}</div><h2>${t}</h2><small>${s}</small><div style="background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px;font-weight:700">${on?(st.stamp?'✓ 도장 받음 · 다시 가기':p):'곧 열려요 (준비 중)'}</div></button>`;
function home(){return `<div class="row" style="flex:1;align-items:stretch"><div class="card" style="background:var(--navy);color:#fff;flex:0 0 min(100%,340px);display:flex;flex-direction:column;gap:14px"><b style="color:#FFD43B">AI 윤리 교육</b><div style="font-size:clamp(44px,6vw,76px);font-weight:900;line-height:1.1">AI<br>약속<br>마을</div><div>가고 싶은 곳을 눌러<br>AI와 지킬 약속을 배워요</div><div style="margin-top:auto" class="say"><span>${MAS}</span><span style="color:var(--ink)">안녕, 나는 약속이야!</span></div></div><div class="tiles" style="flex:2;min-width:300px">${tile('#FF6A45','#B93418',1,'진짜가짜 광장','딥페이크·허위정보','진짜인지 먼저 살펴봐요',true)}${tile('#4F7BFF','#2F55E8',2,'비밀 금고 집','개인정보·프라이버시','',false)}${tile('#2CC98E','#0B7A55',3,'모두의 놀이터','편향·공정성','',false)}${tile('#A878FF','#7B3FE4',4,'솔직 도서관','저작권·AI 활용 정직성','',false)}</div></div>`}
const gate=()=>st.i==5?st.q>=Q.length:st.i==6?st.chk.length>=3:st.i==4?st.off>0:st.i==1?st.pick!==null:true;
function render(){const t=st.t?`<div id="tp"><b>선생님 안내</b> ${st.res?'자료는 수업 전에 한 번 읽어 보고 인쇄해 주세요. 파일은 이 사이트의 resources 폴더에 있어요.':st.home?'1단원만 열려 있어요. 단원은 1차시(40분)로 도착 5분, 배우기 12분, 체험 12분, 퀴즈 7분, 약속 4분을 권장해요.':TN[st.i]}<ul><li>제31조의 표시 의무는 AI 사업자에게 있어요. 위반 시 과태료(최대 3천만 원) 대상이 될 수 있고 시행 초기에는 계도 기간이 있다고 안내돼 있어요.</li><li>세부 기준은 시행령과 정부 가이드라인에 따라 바뀔 수 있으니 수업 전에 국가법령정보센터에서 최신 내용을 확인해 주세요.</li></ul></div>`:'';
app.innerHTML=`<div class="top"><button class="logo" data-a="home">AI 약속 마을</button>${(st.home||st.res)?'<div class="ph"></div>':`<div class="ph">${PH.map((p,k)=>`<span class="${k==phOf[st.i]?'on':''}">${p}</span>`).join('')}</div>`}<button class="tb" data-a="res" aria-pressed="${!!st.res}">자료실</button><button class="tb" data-a="tp" aria-pressed="${!!st.t}">선생님</button></div>${t}<main>${st.res?resRoom():st.home?home():S[st.i]()}</main>${(st.home||st.res)?'':`<div class="nav"><span class="mid">${st.i+1} / ${S.length}</span><button class="btn g" data-a="prev" ${st.i==0?'disabled':''}>이전</button><button class="btn" data-a="${st.i==S.length-1?'home':'next'}" ${gate()?'':'disabled'}>${st.i==S.length-1?'마을로':'다음'}</button></div>`}`;window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||b.getAttribute('aria-disabled')=='true')return;const a=b.dataset.a,v=+b.dataset.v;
if(a=='go'){Object.assign(st,{res:false,home:false,i:0,tab:0,eye:false,pick:null,off:0,q:0,sc:0,ans:null,chk:[]})}
else if(a=='home'){st.home=true;st.res=false}else if(a=='res'){st.res=true}else if(a=='tp')st.t=!st.t;else if(a=='next')st.i++;else if(a=='prev')st.i--;
else if(a=='pick')st.pick=v;else if(a=='tab')st.tab=v;else if(a=='eye')st.eye=!st.eye;else if(a=='off')st.off++;
else if(a=='ans'){if(st.ans===null){st.ans=v;if(v==Q[st.q].a)st.sc++}}else if(a=='nq'){st.q++;st.ans=null}
else if(a=='chk'){const k=st.chk.indexOf(v);k<0?st.chk.push(v):st.chk.splice(k,1)}else if(a=='stamp')st.stamp=true;
render()});
render();
</script></body></html>
