<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 약속 마을 · AI 윤리 수업</title>
<meta name="description" content="초등 1~3학년을 위한 AI 윤리 수업 사이트: 진짜가짜 광장, 비밀 금고 집, 모두의 놀이터, 솔직 도서관">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FF;--card:#fff;--ink:#0B1B3A;--sub:#4A5875;--blue:#2F55E8;--onb:#fff;--coral:#E8492C;--green:#0B8F63;--soft:#E3EAFF;--hi:#FFE9A3;--navy:#0B1B3A;--ok:#E6F8F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1330;--card:#16224A;--ink:#EAF0FF;--sub:#A9B8E0;--blue:#7C9BFF;--onb:#0B1330;--coral:#FF8466;--green:#3DD6A0;--soft:#223066;--hi:#5A4A10;--navy:#070D22;--ok:#10352C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1330;--card:#16224A;--ink:#EAF0FF;--sub:#A9B8E0;--blue:#7C9BFF;--onb:#0B1330;--coral:#FF8466;--green:#3DD6A0;--soft:#223066;--hi:#5A4A10;--navy:#070D22;--ok:#10352C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;font-size:clamp(18px,2vw,26px);line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1280px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px clamp(14px,3vw,40px)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-weight:900;font-size:1.05em;background:none;border:0;padding:0}
.ph{flex:1;display:flex;gap:8px;min-width:260px}.ph span{flex:1;text-align:center;padding:6px 4px;border-radius:22px;background:var(--card);color:var(--sub);font-size:.8em}.ph .on{background:var(--coral);color:#fff;font-weight:900}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph .on{color:#0B1330}}
.tb{border:2px solid var(--blue);background:transparent;border-radius:22px;padding:6px 16px;font-weight:700;color:var(--blue)}
#tp{background:var(--card);border-radius:20px;padding:14px 20px;font-size:.78em;border-left:8px solid var(--blue)}#tp ul{margin:6px 0 0;padding-left:1.2em}
main{flex:1;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(28px,4vw,50px);line-height:1.25;font-weight:900}h2{margin:0;font-size:1.3em}
.tag{display:inline-block;background:var(--coral);color:#fff;border-radius:14px;padding:2px 14px;font-weight:900;font-size:.8em;margin-right:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#0B1330}}
.card{background:var(--card);border-radius:28px;box-shadow:0 10px 26px rgba(11,27,58,.1);padding:clamp(16px,2.2vw,28px)}
.row{display:flex;gap:18px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
.btn{min-height:64px;border-radius:32px;border:0;background:var(--blue);color:var(--onb);font-weight:900;padding:0 40px}.btn.g{background:var(--card);color:var(--ink);font-weight:700}.btn[disabled]{opacity:.4;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;text-decoration:none}.nav{display:flex;gap:14px;justify-content:flex-end;align-items:center;position:sticky;bottom:0;padding:10px 0}.nav .mid{margin-right:auto;font-size:.8em;color:var(--sub)}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:72px;background:var(--card);border:4px solid var(--card);border-radius:24px;padding:12px 18px;font-weight:700;box-shadow:0 8px 20px rgba(11,27,58,.08)}
.opt b{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--onb);display:flex;align-items:center;justify-content:center}.opt.ok{border-color:var(--green);background:var(--ok)}.opt.no{border-color:var(--coral)}
.say{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:12px 20px}.say svg{flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;flex:1}
.tile{border:0;text-align:left;color:#fff;border-radius:32px;padding:24px;min-height:230px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 26px rgba(11,27,58,.2)}.tile h2{font-size:1.5em;margin-top:auto}.tile small{font-size:.8em}
.tile[aria-disabled="true"]{opacity:.55;cursor:default}.n{width:52px;height:52px;border-radius:50%;background:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.pic{position:relative;overflow:hidden;border-radius:20px;min-height:200px;flex:1}
.lab{position:absolute;left:0;right:0;bottom:0;background:#0B1B3A;color:#fff;text-align:center;padding:8px;font-weight:700}
.mk{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.0) 0 14px,rgba(47,85,232,.55) 14px 18px);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 2px 6px #0B1B3A}
table{width:100%;border-collapse:collapse;font-size:.85em}td,th{padding:8px 12px;border-bottom:2px solid var(--soft);text-align:left}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.hl{background:var(--hi);border-radius:6px;padding:0 6px}.stamp{width:150px;height:150px;border-radius:50%;border:8px double var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;transform:rotate(-10deg)}
body{word-break:keep-all}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid #FFD43B;outline-offset:3px}
main h1[tabindex]:focus,main h1[tabindex]:focus-visible{outline:none}
.tb,.logo{min-height:44px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ft{max-width:1280px;margin:0 auto;padding:12px clamp(14px,3vw,40px) 24px;font-size:.7em;color:var(--sub)}
</style></head><body><div id="app"></div>
<footer class="ft">© 2026 AI 약속 마을 · 개인 교사가 수업을 위해 만들어 운영해요. 교육 목적으로 만들었고 학생의 개인정보를 받지 않아요. 법·정책 내용은 수업 전에 최신 내용을 확인해 주세요.</footer>
<script src="units.js"></script>
<script src="app.js"></script></body></html>
