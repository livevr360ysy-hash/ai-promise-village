<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>수업 자료 · AI 약속 마을</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet"><style>body{font-family:"Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#0B1B3A;font-size:13pt;line-height:1.6;word-break:keep-all;max-width:900px;margin:0 auto;padding:16px}h1{font-size:24pt;margin:0 0 4px}h2{font-size:16pt;margin:18px 0 6px;color:#B93418}.sub{color:#4A5875;font-size:11.5pt}table{width:100%;border-collapse:collapse;font-size:11.5pt}td,th{border:1px solid #9AA7C7;padding:6px 8px;vertical-align:top;text-align:left}th{background:#E3EAFF}li{margin:3px 0}.box{border:2px solid #2F55E8;border-radius:10px;padding:8px 14px;margin:8px 0}.line{border-bottom:1.5px solid #0B1B3A;display:inline-block;min-width:90px}.big{font-size:15pt}@page{size:A4;margin:15mm}.pb{position:fixed;top:10px;right:10px;background:#2F55E8;color:#fff;border:0;border-radius:20px;padding:8px 18px;font-size:14pt;font-weight:700;cursor:pointer}@media print{.pb{display:none}}</style></head><body><button class="pb" onclick="window.print()">인쇄하기 (PDF로 저장 가능)</button><div id="doc"></div><script src="units.js"></script><script>
var P=new URLSearchParams(location.search),u=UNITS[(+P.get('u')||1)-1],t=P.get('t')||'plan',h='';
function li(a){return a.map(function(x){return '<li>'+x+'</li>'}).join('')}
var ex=u.exp==='label'?'‘표시 끄기’ 버튼을 학생이 번갈아 눌러 봐요.':'‘'+u.exp.h+'’ 활동을 학생이 번갈아 풀어요.';
var cmpH=u.cmp==='eye'?'숨은 표시와 보이는 표시':u.cmp.h;
document.title=u.id+'단원 '+u.name+' · 수업 자료';
if(t==='plan'){
var S=[['도착','5분','학습 목표를 함께 읽고 “'+u.open.q+'”에 대해 의견을 모아요. 정답을 가르기보다 호기심을 여는 질문이에요.',u.ask[0]],['배우기','12분','‘'+u.learn.h+'’ 탭을 하나씩 눌러 설명하고, ‘'+cmpH+'’ 화면에서 두 가지를 비교해요.',u.ask[1]],['체험','12분',ex+' 답을 고른 까닭을 모둠에서 이야기해요.',u.ask[2]],['퀴즈','7분','퀴즈 3문제를 풀어요. 모둠에서 먼저 의논한 뒤 답해요.',u.ask[3]],['약속','4분','지킬 수 있는 약속을 3개 이상 체크하고 낱말을 복습해요. 활동지의 ‘나의 약속’을 쓰고 도장을 받아요.',u.ask[4]]];
h='<h1>수업 지도안 · '+u.id+'단원 '+u.name+'</h1><div class="sub">AI 약속 마을 · '+u.topic+' · 초등 1~3학년 · 1차시 40분 · 준비물: 전자칠판(또는 프로젝터)과 사이트, 학생 활동지, 연필</div><h2>학습 목표</h2><ol>'+li(u.goals)+'</ol><h2>수업 흐름</h2><table><tr><th>단계</th><th>시간</th><th>활동과 사이트 화면</th><th>발문 예시</th></tr>'+S.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</table><h2>교사 유의사항</h2><ul><li>'+u.legal+'</li><li>학생 개인정보를 받지 않아요. 실제 학생이나 교사의 얼굴·목소리·개인정보를 쓰는 활동은 하지 않아요.</li></ul>';
}else if(t==='sheet'){
var n=u.pairs.length;
h='<h1 style="font-size:26pt">'+u.name+' 활동지</h1><div class="sub big">'+u.id+'단원 '+u.topic+' &nbsp;&nbsp; 이름: <span class="line" style="min-width:200px"></span></div><h2>1. 알맞은 것을 선으로 이어요</h2><table class="big">'+u.pairs.map(function(p,i){return '<tr><td style="width:44%">'+p[0]+'</td><td style="width:12%;text-align:center">○ &nbsp; ○</td><td>'+u.pairs[(i+1)%n][1]+'</td></tr>'}).join('')+'</table><h2>2. 빈칸에 알맞은 말을 써요</h2><div class="box big">낱말 상자: &nbsp; '+u.word.join(' &nbsp; ')+'</div><p class="big">'+u.fill.map(function(f){return f.replace('____','<span class="line"></span>')}).join('<br>')+'</p><h2>3. 나의 약속</h2><p class="big">지킬 수 있는 약속에 ✓ 해요.</p><p class="big">'+u.pr.map(function(x){return '□ '+x}).join('<br>')+'</p><p class="big">나의 다짐: <span class="line" style="min-width:420px"></span></p><p class="sub">(선생님용 정답) '+u.pairs.map(function(p){return p[0]+' → '+p[1]}).join(' / ')+'</p>';
}else{
var hd=u.goals.map(function(g){return g.replace(/ 수 있어요.| 정해요./,'')}).concat(['오늘의 약속을 말해요','모둠 활동에 참여해요','잘 모르면 어른께 물어요']);
var rows=''; for(var i=0;i<12;i++)rows+='<tr style="height:30px">'+'<td></td>'.repeat(7)+'</tr>';
h='<h1>평가 질문과 체크리스트 · '+u.id+'단원 '+u.name+'</h1><div class="sub">AI 약속 마을 · 초등 1~3학년 · 말하기와 관찰 중심 평가</div><h2>평가 질문 (구두 또는 퀴즈)</h2><table><tr><th style="width:55%">질문</th><th>기대하는 답</th></tr>'+u.ev.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table><h2>관찰 체크리스트 (○ 잘함 △ 보통 ✕ 도움 필요)</h2><table style="font-size:10pt"><tr><th>번호·이름</th>'+hd.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+rows+'</table>';
}
document.getElementById('doc').innerHTML=h;
</script></body></html>
